name: CI

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore ImageCare.sln

      - name: Run tests
        run: >-
          dotnet test ImageCare.sln
          --configuration Release
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: Build Windows x64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore application
        run: >-
          dotnet restore ImageCare.UI.Avalonia/ImageCare.UI.Avalonia.csproj
          --runtime win-x64
          -p:PublishReadyToRun=true

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish ImageCare.UI.Avalonia/ImageCare.UI.Avalonia.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishReadyToRun=true `
            -p:DebugType=None `
            --output artifacts/windows-x64/publish

          Get-ChildItem artifacts/windows-x64/publish -Filter *.pdb -Recurse | Remove-Item -Force
          Get-ChildItem artifacts/windows-x64/publish -Filter *.dylib -Recurse | Remove-Item -Force
          Compress-Archive `
            -Path artifacts/windows-x64/publish/* `
            -DestinationPath "artifacts/ImageCare-${{ github.ref_name }}-Windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ImageCare-Windows-x64
          path: artifacts/ImageCare-*-Windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish application bundle
        run: |
          zsh scripts/publish-macos-arm64.sh
          tar -czf "artifacts/ImageCare-${{ github.ref_name }}-macOS-arm64.tar.gz" \
            -C artifacts/macos-arm64 ImageCare.app

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: ImageCare-macOS-arm64
          path: artifacts/ImageCare-*-macOS-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: ImageCare-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
